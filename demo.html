:root{
  --brand:#004164;--accent:#EF791E;--accent2:#FBB911;
  --bg:#F5F7F8;--surface:#FFFFFF;--text:#142D3D;--muted:#526675;--border:#DCE4E8;
  --success:#26764D;--warning:#9A5700;--error:#B42318;
  --brand-50:#E6EEF3;--brand-100:#CCDDE7;
  --grad:linear-gradient(115deg,var(--accent),var(--accent2));
  --ink:#004164;--page:#E8EDF0;--bar:rgba(255,255,255,.92);--hover:#FAFBFC;--t-warm:#FFF3D6;--i-warm:#7A5200;--t-warn:#FCF0DC;--i-warn:#8A3E05;--t-ok:#E3F1EA;--t-err:#FBE8E6;--t-mut:#EEF2F4;--t-info:#F7FAFC;--track:#EDF1F3;--track2:#C9D5DC;--b-warm:#F1D9B5;--b-ok:#BFE0CD;--b-err:#F2C9C4;
  --r:14px;--r-lg:18px;
  --font:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);color:var(--text);background:var(--page);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent2);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{flex:none}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:12px}
.b{font-weight:600}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack>*+*{margin-top:12px}
.stack-s>*+*{margin-top:8px}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ===== Demo bar (desktop) ===== */
.demobar{position:sticky;top:0;z-index:50;height:56px;display:flex;align-items:center;gap:16px;padding:0 20px;background:var(--bar);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.demobar .tag{font-size:12px;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:4px 10px;white-space:nowrap}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:3px;gap:2px}
.seg button{min-height:36px;padding:0 14px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,45,61,.12)}
.demobar select{height:36px;border:1px solid var(--border);border-radius:10px;padding:0 10px;background:var(--surface);color:var(--text);font-size:13px}
.iconbtn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:12px;color:var(--ink);position:relative}
.iconbtn:hover{background:var(--brand-50)}
.iconbtn.sm{width:36px;height:36px}

/* ===== Stage ===== */
.stage{display:flex;justify-content:center;align-items:flex-start;gap:40px;padding:24px 20px 32px;min-height:calc(100vh - 56px)}
.phone{width:410px;flex:none;height:min(864px,calc(100vh - 104px));min-height:640px;background:#0E1E28;border-radius:54px;padding:10px;box-shadow:0 30px 60px -20px rgba(0,40,64,.35),0 0 0 1px rgba(0,0,0,.2)}
.screen{position:relative;height:100%;border-radius:44px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;isolation:isolate}
.statusbar{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0;font-size:14px;font-weight:600;background:var(--bg)}
.statusbar .notch{width:110px;height:30px;background:#0E1E28;border-radius:20px}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.pad{padding:8px 20px 28px}

/* scenarios side panel */
.scen{width:300px;flex:none;position:sticky;top:80px}
.scen h3{font-size:15px;color:var(--ink);margin-bottom:4px}
.scen .item{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--border);margin-top:8px;width:100%}
.scen .item:hover{border-color:var(--brand-100)}
.scen .num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--brand-50);color:var(--ink);font-size:12px;font-weight:700;flex:none}
.scen .item.done .num{background:var(--success);color:#fff}
.scen .t{font-size:13px;font-weight:600;line-height:1.35}
.scen .d{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.35}

/* ===== Employee header ===== */
.apphead{display:flex;align-items:center;justify-content:space-between;padding:6px 14px 6px 20px;background:var(--bg);min-height:56px}
.logo{display:inline-flex;align-items:center;gap:8px;font-size:15px;letter-spacing:.04em;color:var(--ink);white-space:nowrap}
.logo b{font-weight:800}
.logo span{font-weight:500}
.avatar{border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;background:var(--brand);flex:none;position:relative}
.avatar.ring{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent2)}
.dot{position:absolute;top:4px;right:4px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--error);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg)}
.backhead{display:flex;align-items:center;gap:4px;padding:6px 12px;min-height:56px;background:var(--bg);position:sticky;top:0;z-index:5}
.backhead h2{font-size:17px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

h1{font-size:26px;line-height:1.15;font-weight:800;color:var(--ink);letter-spacing:-.01em}
h2{font-size:18px;line-height:1.3;font-weight:700}
h3{font-size:16px;line-height:1.3;font-weight:600}
.sect{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 10px}
.sect h2{font-size:17px}
.link{color:var(--ink);font-weight:600;font-size:14px;min-height:44px;display:inline-flex;align-items:center;gap:4px}

/* ===== Cards ===== */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px}
.card.tight{padding:12px 14px}
.card.flat{border-color:transparent;box-shadow:0 1px 2px rgba(20,45,61,.06)}
.listcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:56px;width:100%;text-align:left}
.li+.li{border-top:1px solid var(--border)}
button.li:hover{background:var(--hover)}
.li .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--brand-50);color:var(--ink);flex:none}
.li .chev{color:var(--muted)}

.hero{position:relative;overflow:hidden;background:var(--brand);color:#fff;border-radius:var(--r-lg);padding:18px;width:100%;text-align:left;display:block}
.pattern{position:absolute;right:-6px;top:0;bottom:0;width:190px;pointer-events:none}
.hero .pattern{position:absolute;right:-6px;top:0;bottom:0;width:190px;pointer-events:none}
.hero .strip{position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--accent)}
.hero .eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent2)}
.hero h3{font-size:20px;font-weight:800;letter-spacing:-.01em;margin-top:6px}
.hero p{font-size:14px;opacity:.85;margin-top:4px;max-width:230px}
.chip-cta{display:inline-flex;align-items:center;gap:6px;margin-top:14px;background:var(--cta);color:var(--on-cta);font-weight:600;font-size:14px;border-radius:10px;padding:8px 12px}

.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--brand-50);color:var(--ink)}
.pill.ok{background:var(--t-ok);color:var(--success)}
.pill.warn{background:var(--t-warn);color:var(--warning)}
.pill.err{background:var(--t-err);color:var(--error)}
.pill.mut{background:var(--t-mut);color:var(--muted)}
.pill.demo{background:var(--t-warm);color:var(--i-warm)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:14px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;color:var(--text)}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}

/* buttons */
.btn{min-height:48px;padding:0 18px;border-radius:13px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand);color:#fff}
.btn.warm{background:var(--cta);color:var(--on-cta)}
.btn.ghost{border:1px solid var(--border);background:var(--surface);color:var(--ink)}
.btn.danger{border:1px solid var(--b-err);background:#fff;color:var(--error)}
.btn.auto{width:auto}
.btn.sm{min-height:40px;font-size:14px;padding:0 14px;border-radius:11px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* mood */
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:14px}
.mood{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 2px;border-radius:14px;border:1px solid var(--border);background:var(--surface);font-size:12px;font-weight:500;color:var(--muted);min-height:76px}
.mood svg{color:var(--ink)}
.mood:hover{border-color:var(--brand-100)}
.mood[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.mood[aria-pressed=true] svg{color:#fff}

.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.quick button{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--text);min-height:88px;justify-content:center}
.quick .qi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--brand-50);color:var(--ink)}
.quick button:nth-child(2) .qi{background:var(--t-warm);color:var(--i-warm)}
.quick button:nth-child(3) .qi{background:var(--t-warn);color:var(--i-warn)}

.playbtn{width:48px;height:48px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:var(--text);flex:none}
.cover{border-radius:14px;overflow:hidden;flex:none;display:block}
.cover svg{display:block;width:100%;height:100%}

/* practice grid */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;position:relative;text-align:left;display:flex;flex-direction:column}
.pcard .cover{border-radius:0;height:92px}
.pcard .body{padding:10px 12px 12px}
.pcard .t{font-size:14px;font-weight:600;line-height:1.3}
.pcard.wide{grid-column:1/-1;flex-direction:row;align-items:center}
.pcard.wide .cover{width:116px;height:96px}
.fav{position:absolute;top:6px;right:6px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.92);color:var(--ink)}
.fav[aria-pressed=true]{color:var(--accent)}

.segtabs{display:grid;grid-template-columns:1fr 1fr;background:var(--t-mut);border-radius:13px;padding:4px;gap:4px}
.segtabs button{min-height:40px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted);text-align:center}
.segtabs button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,45,61,.1)}

.search{display:flex;align-items:center;gap:8px;height:46px;border-radius:13px;background:var(--surface);border:1px solid var(--border);padding:0 12px;color:var(--muted)}
.search input{border:0;outline:0;background:none;flex:1;font-size:15px;color:var(--text);min-width:0}

/* forms */
.field{display:block}
.field>.lbl{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.input,.textarea,.select{color:var(--text);width:100%;min-height:48px;border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:12px 14px;font-size:15px;outline:none}
.textarea{min-height:104px;resize:vertical;line-height:1.45}
.input:focus,.textarea:focus,.select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-50)}
.field.err .input,.field.err .textarea,.field.err .select,.field.err .opts{border-color:var(--error)}
.errtxt{color:var(--error);font-size:13px;margin-top:6px;display:flex;gap:6px;align-items:center}
.hint{color:var(--muted);font-size:12px;margin-top:6px}
.opts{display:grid;gap:8px;border-radius:14px;border:1px solid transparent}
.opt{display:flex;align-items:center;gap:12px;min-height:50px;border:1px solid var(--border);border-radius:12px;padding:10px 14px;background:var(--surface);cursor:pointer;font-size:15px}
.opt input{width:20px;height:20px;accent-color:var(--ink);flex:none}
.opt:has(input:checked){border-color:var(--brand);background:var(--brand-50)}
.check{display:flex;gap:12px;align-items:flex-start;font-size:14px;cursor:pointer;min-height:44px}
.check input{width:22px;height:22px;accent-color:var(--ink);margin-top:1px;flex:none}
.file{display:flex;align-items:center;gap:12px;min-height:56px;border:1px dashed var(--border);border-radius:12px;padding:10px 14px;background:var(--surface);cursor:pointer;color:var(--ink);font-weight:600;font-size:14px}
.file input{position:absolute;opacity:0;width:1px;height:1px}
.toggle{position:relative;width:48px;height:28px;flex:none}
.toggle input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}
.toggle span{position:absolute;inset:0;border-radius:14px;background:var(--track2);transition:.2s}
.toggle span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:.2s}
.toggle input:checked+span{background:var(--brand)}
.toggle input:checked+span::after{transform:translateX(20px)}
.toggle input:focus-visible+span{outline:3px solid var(--accent2);outline-offset:2px}

.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--brand-50);color:var(--ink);font-size:13px;line-height:1.45}
.notice.warm{background:var(--t-warm);color:var(--i-warm)}
.notice.err{background:var(--t-err);color:var(--error)}

/* tab bar */
.tabbar{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--border);padding:6px 6px calc(8px + env(safe-area-inset-bottom))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;justify-content:center;font-size:12px;font-weight:600;color:var(--muted);position:relative;border-radius:12px}
.tab[aria-current=page]{color:var(--ink)}
.tab[aria-current=page]::before{content:"";position:absolute;top:-6px;left:50%;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--accent);transform:translateX(-50%)}

/* offline banner */
.offline{display:flex;align-items:center;gap:10px;padding:8px 16px;background:#2B3A44;color:#fff;font-size:13px;flex:none}
.offline button{margin-left:auto;color:var(--accent2);font-weight:600;min-height:32px}

/* toast & sheet */
.toast{position:absolute;left:16px;right:16px;bottom:92px;z-index:40;background:#14262F;color:#fff;border-radius:14px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:up .25s ease}
.toast .ti{color:var(--accent2)}
.toast.ok .ti{color:#7FD3A7}
@keyframes up{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.overlay{position:absolute;inset:0;z-index:30;background:rgba(14,30,40,.45);display:flex;align-items:flex-end;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--surface);width:100%;border-radius:24px 24px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));max-height:88%;overflow:auto;animation:up .25s ease}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 14px}

/* skeleton */
.sk{background:linear-gradient(90deg,var(--t-mut) 0,var(--hover) 50%,var(--t-mut) 100%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:10px}
@keyframes sk{to{background-position:-200% 0}}

/* empty */
.empty{text-align:center;padding:32px 20px;color:var(--muted)}
.empty .eic{width:64px;height:64px;border-radius:20px;background:var(--brand-50);color:var(--ink);display:grid;place-items:center;margin:0 auto 12px}
.empty h3{color:var(--text);margin-bottom:4px}

/* timeline */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--border)}
.tl .st{position:relative;padding-bottom:14px}
.tl .st::before{content:"";position:absolute;left:-21px;top:4px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--brand-100)}
.tl .st.on::before{background:var(--brand);border-color:var(--brand)}
.tl .st:last-child{padding-bottom:0}

/* chat */
.chatwrap{display:flex;flex-direction:column;height:100%}
.msgs{flex:1;overflow-y:auto;padding:12px 16px 16px;display:flex;flex-direction:column;gap:8px;scrollbar-width:none}
.msg{max-width:82%;padding:10px 12px;border-radius:16px;font-size:15px;line-height:1.4;background:var(--surface);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:6px}
.msg.me{align-self:flex-end;background:var(--brand);color:#fff;border-color:var(--brand);border-bottom-left-radius:16px;border-bottom-right-radius:6px}
.msg .who{font-size:12px;font-weight:600;color:var(--ink);margin-bottom:2px}
.msg .meta{font-size:11px;opacity:.7;margin-top:4px;display:flex;gap:6px;align-items:center;justify-content:flex-end}
.msg .att{display:flex;align-items:center;gap:6px;font-size:13px;padding:6px 8px;border-radius:10px;background:rgba(255,255,255,.14);margin-bottom:6px}
.msg:not(.me) .att{background:var(--brand-50)}
.msg.auto{background:var(--t-warm);border-color:var(--b-warm)}
.daysep{align-self:center;font-size:12px;color:var(--muted);background:var(--t-mut);border-radius:999px;padding:3px 10px;margin:6px 0}
.composer{flex:none;display:flex;align-items:flex-end;gap:6px;padding:8px 10px;background:var(--surface);border-top:1px solid var(--border)}
.composer textarea{flex:1;min-height:44px;max-height:120px;border:1px solid var(--border);border-radius:22px;padding:11px 16px;resize:none;outline:none;font-size:15px;background:var(--bg)}
.composer .send{width:44px;height:44px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none}
.attpill{display:flex;align-items:center;gap:8px;margin:0 10px 0;padding:8px 12px;background:var(--brand-50);border-radius:12px;font-size:13px;color:var(--ink)}

/* player */
.player{min-height:100%;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--brand) 0,#03314B 100%);color:#fff}
.player .backhead{background:transparent;color:#fff}
.player .iconbtn{color:#fff}
.player .iconbtn:hover{background:rgba(255,255,255,.1)}
.prog{height:6px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:3px;width:0}
.bigplay{width:76px;height:76px;border-radius:50%;background:var(--accent2);color:var(--text);display:grid;place-items:center}
.ctrl{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:14px;border:1px solid rgba(255,255,255,.25)}
.breath{width:230px;height:230px;margin:10px auto;position:relative;display:grid;place-items:center}
.breath .ring{position:absolute;inset:0;border-radius:50%;border:1px dashed rgba(255,255,255,.25)}
.breath .ball{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFD86B 0,var(--accent2) 40%,var(--accent) 100%);transform:scale(.55);box-shadow:0 0 60px rgba(251,185,17,.35)}
.breath .lbl{position:absolute;text-align:center;color:var(--text)}
.breath .lbl b{display:block;font-size:20px}

/* print */
.paper{background:#fff;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,.08);padding:22px;font-size:13px}
.paper h4{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.paper table{width:100%;border-collapse:collapse}
.paper td{padding:6px 0;border-bottom:1px solid var(--track);vertical-align:top}

/* login */
.login{min-height:100%;display:flex;flex-direction:column;padding:24px 24px calc(24px + env(safe-area-inset-bottom));background:var(--surface);position:relative;overflow:hidden}
.login .art{position:absolute;right:-90px;top:-50px;width:260px;opacity:.8;pointer-events:none}

/* ===== HR cabinet ===== */
.cab{display:grid;grid-template-columns:248px 1fr;min-height:calc(100vh - 56px)}
.side{background:var(--surface);border-right:1px solid var(--border);padding:18px 12px;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto}
.side .org{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;border-bottom:1px solid var(--border);margin-bottom:10px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:11px;font-size:14px;font-weight:500;color:var(--muted);width:100%}
.nav button:hover{background:var(--bg)}
.nav button[aria-current=page]{background:var(--brand-50);color:var(--ink);font-weight:600}
.nav .cnt{margin-left:auto;min-width:22px;height:22px;border-radius:11px;background:var(--accent2);color:var(--text);font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.main{padding:28px 32px 48px;max-width:1240px;width:100%}
.main h1{font-size:26px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px}
.tile .v{font-size:28px;font-weight:800;color:var(--ink);margin-top:6px;font-variant-numeric:tabular-nums}
.tile .l{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.sel td{background:var(--brand-50)}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--hover)}
.bars .br{display:grid;grid-template-columns:150px 1fr 36px;align-items:center;gap:10px;font-size:13px;margin-top:10px}
.bars .bt{height:10px;border-radius:5px;background:var(--track);overflow:hidden}
.bars .bt i{display:block;height:100%;background:var(--brand);border-radius:5px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px;position:sticky;top:80px}
.hrhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.swatch{width:28px;height:28px;border-radius:8px;border:1px solid rgba(0,0,0,.08)}
.modal{position:fixed;inset:0;z-index:80;background:rgba(14,30,40,.45);display:grid;place-items:center;padding:20px;animation:fade .2s}
.modal .box{background:var(--surface);border-radius:20px;padding:24px;width:min(560px,100%);max-height:90vh;overflow:auto}
.ftoast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;background:#14262F;color:#fff;border-radius:14px;padding:12px 16px;font-size:14px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:up .25s ease;max-width:calc(100vw - 32px)}

@media (max-width:1180px){.scen{display:none}}
@media (max-width:900px){
  .cab{grid-template-columns:1fr}
  .side{position:sticky;top:56px;height:auto;z-index:20;border-right:0;border-bottom:1px solid var(--border);padding:8px 10px}
  .side .org,.side .sidefoot{display:none}
  .nav{flex-direction:row;overflow-x:auto;scrollbar-width:none}
  .nav button{width:auto;white-space:nowrap;flex:none}
  .main{padding:18px 16px 40px}
  .grid2{grid-template-columns:1fr}
  .panel{position:static}
  .tbl .hide-m{display:none}
  .demobar{padding:0 10px;gap:8px}
  .demobar .tag,.demobar .wide{display:none}
}
@media (max-width:520px){
  body{background:var(--bg)}
  .stage{padding:0;min-height:100dvh}
  .phone{width:100%;height:100dvh;min-height:0;padding:0;border-radius:0;box-shadow:none;background:var(--bg)}
  .screen{border-radius:0}
  .statusbar{display:none}
  .apphead,.backhead,.login{padding-top:calc(6px + env(safe-area-inset-top))}
  .mode-employee .demobar{display:none}
  .demobar .seg button{padding:0 10px;font-size:12px}
  .bars .br{grid-template-columns:110px 1fr 30px}
}
@media print{
  body{background:#fff}
  .demobar,.tabbar,.backhead,.noprint,.statusbar{display:none!important}
  .stage{padding:0}
  .phone{width:auto;height:auto;background:none;box-shadow:none;padding:0}
  .screen,.scroll{overflow:visible;height:auto;border-radius:0}
  .paper{box-shadow:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.toggle input:disabled+span{opacity:.45}

.sect h2::before{content:"";display:inline-block;width:10px;height:14px;margin-right:8px;background:var(--accent);clip-path:polygon(30% 0,70% 0,100% 100%,0 100%);vertical-align:-1px}

body.dark{--bg:#0F1B23;--surface:#16252F;--text:#E4ECF1;--muted:#9AAEBB;--border:#26394A;--page:#0A141A;--bar:rgba(15,27,35,.92);--hover:#1B2D38;--t-warm:rgba(251,185,17,.14);--i-warm:#F7C548;--t-warn:rgba(239,121,30,.18);--i-warn:#F4A15F;--t-ok:rgba(70,180,120,.18);--t-err:rgba(240,90,80,.18);--t-mut:#20323E;--t-info:#182B36;--track:#24394A;--track2:#3A5062;--b-warm:#5A4520;--b-ok:#245C40;--b-err:#6A2A25;--success:#6CCB98;--warning:#F0A44E;--error:#FF8A80;color-scheme:dark}
body.dark .phone{background:#05090C;box-shadow:0 30px 60px -20px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06)}
body.dark .statusbar .notch{background:#05090C}
body.dark .paper{color:#142D3D}
body.dark .pill.demo{background:rgba(251,185,17,.16);color:#F7C548}
body.dark .msg.me{background:#0B5C8A;border-color:#0B5C8A}
.langsel{height:36px;border:1px solid var(--border);border-radius:10px;padding:0 8px;background:var(--surface);color:var(--text);font-size:13px;font-weight:600}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.calc{aspect-ratio:1;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:14px;line-height:1;min-height:40px}
.calc i{height:12px}

.quick4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.quick4 button{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;min-height:78px;justify-content:center;color:var(--text);text-align:center}
.quick4 .qi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--brand-50);color:var(--ink)}
.login{padding-top:20px}

/* responsive cabinet */
@media (max-width:900px){
  .cab{grid-template-columns:minmax(0,1fr)}
  .main{min-width:0}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .tbl{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
}
@media (max-width:520px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hrhead{align-items:flex-start}
  .demobar{overflow-x:auto;scrollbar-width:none}
  .demobar>*{flex:none}
  html.embed .demobar{display:none!important}
}
.cab{grid-template-columns:248px minmax(0,1fr)}
.main{min-width:0}

function save(){try{const c=Object.assign({},S,{ui:Object.assign({},S.ui,{toast:null,modal:null,player:null})});localStorage.setItem(KEY,JSON.stringify(c))}catch(e){}}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+'-'+Math.random().toString(36).slice(2,7)+Date.now().toString(36).slice(-4);
const nowIso=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,19)};
const pad2=n=>String(n).padStart(2,'0');
function fd(iso){if(!iso)return '—';const d=new Date(iso.length<=10?iso+'T00:00:00':iso);return pad2(d.getDate())+'.'+pad2(d.getMonth()+1)+'.'+d.getFullYear()}
function ft(iso){const d=new Date(iso);return pad2(d.getHours())+':'+pad2(d.getMinutes())}
function fdt(iso){const d=new Date(iso),n=new Date();const same=d.toDateString()===n.toDateString();const y=new Date(n);y.setDate(n.getDate()-1);if(same)return 'сегодня, '+ft(iso);if(d.toDateString()===y.toDateString())return 'вчера, '+ft(iso);return fd(iso)}
function plural(n,f){n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return f[2];if(n1>1&&n1<5)return f[1];if(n1===1)return f[0];return f[2]}
function tenure(start){const s=new Date(start+'T00:00:00'),n=new Date();let m=(n.getFullYear()-s.getFullYear())*12+n.getMonth()-s.getMonth();if(n.getDate()<s.getDate())m--;const y=Math.floor(m/12),mm=m%12;return (y?y+' '+plural(y,['год','года','лет']):'')+(mm?(y?' ':'')+mm+' мес.':'')||'меньше месяца'}
function daysTo(iso){return Math.ceil((new Date(iso+'T00:00:00')-new Date())/864e5)}
function initials(n){return n.split(' ').map(x=>x[0]).slice(0,2).join('')}
const T=()=>S.tenants[S.tenantId];
const P=()=>S.priv[S.tenantId];
const ME=()=>T().employees.find(e=>e.id===T().meId);
const emp=id=>T().employees.find(e=>e.id===id)||{name:'Сотрудник',pos:'',unit:''};
function credStatus(c){if(c.status==='confirmed'){const d=daysTo(c.until);if(d<0)return 'expired';if(d<=60)return 'expiring'}return c.status}
function pill(map,key,extra){const m=map[key]||[key,'mut'];return `<span class="pill ${m[1]}">${extra||''}${esc(m[0])}</span>`}

  if((t.unread||{}).hr)att.push({a:'openChat',id:'hr',i:'chat',t:'Новое сообщение от офиса',d:'HR-поддержка'});
  t.notifications.filter(n=>!n.read&&n.kind==='req').slice(0,1).forEach(n=>att.push({a:'openNotif',id:n.id,i:'inbox',t:n.title,d:n.text}));

/* ---- календарь вахты ---- */
function dayType(date){const d=vd(),Ln=V().len;const k=Math.round((new Date(date.getFullYear(),date.getMonth(),date.getDate())-d.start)/864e5);const pos=((k%(2*Ln))+2*Ln)%(2*Ln);
  if(pos===2*Ln-1)return 'travel';if(pos===0)return 'arrive';if(pos<Ln){const n=pos+1;if(n===11||n===22)return 'off';if(n>=12&&n<=21)return 'night';return 'day'}if(pos===Ln)return 'leave';return 'home'}
function vahtaStats(){const Ln=V().len;let dn=0,nn=0,off=0;for(let n=2;n<=Ln;n++){if(n===11||n===22)off++;else if(n>=12&&n<=21)nn++;else dn++}return {sh:dn+nn,dn,nn,off}}
const CAL_ST={travel:'background:var(--t-warn);color:var(--i-warn)',leave:'background:var(--t-warn);color:var(--i-warn)',arrive:'background:var(--accent);color:var(--on-cta)',day:'background:var(--t-warm);color:var(--i-warm)',night:'background:var(--brand);color:#fff',off:'background:var(--t-mut);color:var(--muted)',home:'background:transparent;color:var(--text)'};
const CAL_IC={travel:'arrow',leave:'arrow',arrive:'home',day:'sun',night:'moon',off:null,home:null};
function Calendar(){const off=S.ui.calOff||0;const now=new Date();const m0=new Date(now.getFullYear(),now.getMonth()+off,1);
  const first=(m0.getDay()+6)%7,days=new Date(m0.getFullYear(),m0.getMonth()+1,0).getDate();
  const sel=S.ui.calSel?new Date(S.ui.calSel+'T00:00:00'):new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const cells=[];for(let i=0;i<first;i++)cells.push('<span></span>');
  for(let dd=1;dd<=days;dd++){const date=new Date(m0.getFullYear(),m0.getMonth(),dd),t=dayType(date);const isToday=date.toDateString()===now.toDateString(),isSel=date.toDateString()===sel.toDateString();
    cells.push(`<button class="calc" style="${CAL_ST[t]};${isToday?'outline:2px solid var(--ink);outline-offset:1px;':''}${isSel?'box-shadow:0 0 0 3px var(--accent2) inset;':''}" data-a="calSel" data-v="${iso(date)}" aria-label="${dm(date)}: ${L('lg_'+(t==='leave'?'travel':t))}"><b>${dd}</b>${CAL_IC[t]?ic(CAL_IC[t],12,2):'<i></i>'}</button>`)}
  const st=vahtaStats(),d=vd(),t=dayType(sel);
  const lg=['travel','arrive','day','night','off','home'];
  return `${BackHead(L('calendar'))}<div class="pad">
   <div class="row between"><button class="iconbtn" data-a="calNav" data-v="-1" aria-label="Назад">${ic('chevL',22)}</button><h2>${monTitle(m0)}</h2><button class="iconbtn" data-a="calNav" data-v="1" aria-label="Вперёд">${ic('chevR',22)}</button></div>
   <div class="calg" style="margin-top:6px">${WD[LG()].map(w=>`<span class="xs muted" style="text-align:center">${w}</span>`).join('')}${cells.join('')}</div>
   ${off!==0?`<button class="link" style="margin:4px auto 0;display:flex" data-a="calNav" data-v="0">${L('to_today')}</button>`:''}
   <div class="row" style="flex-wrap:wrap;gap:6px;margin-top:12px">${lg.map(x=>`<span class="pill" style="${CAL_ST[x]};${x==='home'?'border:1px solid var(--border)':''}">${L('lg_'+x)}</span>`).join('')}</div>
   <div class="card" style="margin-top:14px"><div class="xs muted">${dm(sel)}, ${wd(sel)}</div><div class="b" style="font-size:17px;margin-top:2px">${L('cd_'+t)}</div></div>
   <div class="card" style="margin-top:10px"><div class="b small">${L('cal_this')}: ${dm(d.start)} — ${dm(d.end)}</div><p class="small muted" style="margin-top:4px">${L('cal_sum',st)}</p><p class="small muted">${L('cal_next',{d:dm(d.next)})}</p><p class="xs muted" style="margin-top:6px">${L('sched_note')}</p></div>
  </div>`}

  const att=[];myCreds().forEach(c=>{const st=credStatus(c);if(['expiring','expired','returned'].includes(st))att.push({a:'go',s:'doc',id:c.id,i:'clock',t:c.title,d:st==='returned'?'Возвращён HR на уточнение':st==='expired'?'Срок истёк':'Срок истекает '+fd(c.until)})});

   <p class="small muted">${new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})}</p>

   ${check}${attHtml}

   ${o.modules.sain?`<button class="card row" style="margin-top:12px;width:100%;text-align:left" data-a="openPractice" data-id="p1"><span class="cover" style="width:64px;height:64px">${cover('p1','breath')}</span><span class="grow"><span class="b" style="display:block">Восстановление за 5 минут</span><span class="small muted">Дыхание 4–6 · 5 мин · с таймером</span></span><span class="playbtn" aria-hidden="true">${ic('play',20)}</span></button>`:''}

   <div class="quick">${quick.map(b=>`<button data-a="openBenefit" data-id="${b.id}"><span class="qi">${ic(b.icon)}</span>${esc(b.qlabel||b.title.replace('Санаторий ','').replace(/[«»]/g,''))}</button>`).join('')}<button data-a="openChat" data-id="hr"><span class="qi">${ic('chat')}</span>Написать HR</button></div>
   ${ch?`<div class="sect"><h2>Сделано по обращениям</h2><button class="link" data-a="go" data-s="changes">Все ${ic('chevR',16)}</button></div>
   <button class="card" style="width:100%;text-align:left;border-left:4px solid var(--accent2)" data-a="go" data-s="changes"><span class="xs muted">${esc(ch.cat)} · ${fd(ch.at)}${ch.n?` · ${ch.n} ${plural(ch.n,['обращение','обращения','обращений'])}`:''}</span><span class="b" style="display:block;margin-top:4px">${esc(ch.text)}</span></button>`:''}

  </div>`}

/* ---- Паспорт ---- */
function myCreds(){return T().credentials.filter(c=>c.owner===T().meId)}
function Passport(){

  const attention=cr.filter(c=>['expiring','expired','returned'].includes(credStatus(c)));

  return `${Head()}<div class="pad">
   <h1>Документы</h1><p class="small muted" style="margin-top:4px">Навыки, удостоверения и опыт. Это рабочий профиль, а не паспорт гражданина и не официальный допуск.</p>

     <div style="background:var(--bg);border-radius:12px;padding:10px 4px"><div class="b" style="color:var(--ink)">${fd(me.start)}</div><div class="xs muted">в компании с</div></div>
     <div style="background:var(--bg);border-radius:12px;padding:10px 4px"><div class="b" style="color:var(--ink)">${cr.filter(c=>c.status==='confirmed').length} из ${cr.length}</div><div class="xs muted">подтверждено</div></div></div></div>
   ${attention.length?`<button class="notice warm" style="margin-top:12px;width:100%;text-align:left" data-a="go" data-s="doc" data-id="${attention[0].id}">${ic('clock',18)}<span class="grow"><b>${attention.length===1?'Документ требует внимания':'Документы требуют внимания'}</b><br>${esc(attention[0].title)} — ${esc(CSTATUS[credStatus(attention[0])][0].toLowerCase())}</span>${ic('chevR',18)}</button>`:''}
   <div class="sect"><h2>Навыки</h2><span class="xs muted row" style="gap:4px">${ic('check',14)}подтверждено работодателем</span></div>
   <div class="row" style="flex-wrap:wrap;gap:8px">${t.skills.map(s=>`<span class="chip" style="height:34px;cursor:default">${s.c?`<span style="color:var(--success)">${ic('check',16,2.2)}</span>`:''}${esc(s.n)}</span>`).join('')}</div>
   <div class="sect"><h2>Документы</h2></div>
   <div class="listcard">${cr.map(c=>{const st=credStatus(c);return `<button class="li" data-a="go" data-s="doc" data-id="${c.id}"><span class="ic">${ic('doc',20)}</span><span class="grow"><span class="b" style="display:block;font-size:14px">${esc(c.title)}</span><span class="xs muted">до ${fd(c.until)}</span><span style="display:block;margin-top:4px">${pill(CSTATUS,st)}</span></span><span class="chev">${ic('chevR',20)}</span></button>`}).join('')}</div>
   <div class="sect"><h2>Опыт</h2></div>
   <div class="card"><div class="tl">${t.experience.map((x,i)=>`<div class="st ${i===0?'on':''}"><div class="b" style="font-size:14px">${esc(x.t)}</div><div class="xs muted">${esc(x.u)} · ${esc(x.p)}</div></div>`).join('')}</div></div>
   <div class="sect"><h2>Возможности внутри компании</h2></div>
   <div class="stack-s">${OppCards()}</div>
   <button class="btn ghost" style="margin-top:20px" data-a="go" data-s="print">${ic('download',20)}Экспорт паспорта в PDF</button>
   <p class="xs muted" style="margin-top:8px;text-align:center">Выгрузить паспорт можно в любой момент</p>

function OppCards(){const t=T();const list=t.opportunities.filter(o=>o.published);
  if(!list.length)return Empty('brief','Пока нет открытых возможностей','Когда HR опубликует позицию, она появится здесь');
  return list.map(o=>{const mine=t.interests.find(i=>i.opp===o.id&&i.emp===t.meId);return `<button class="card row" style="width:100%;text-align:left" data-a="go" data-s="opp" data-id="${o.id}"><span class="ic" style="width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--brand);color:#fff;flex:none">${ic('brief',20)}</span><span class="grow"><span class="b" style="display:block">${esc(o.title)}</span><span class="xs muted">${esc(o.unit)} · опубликовано ${fd(o.at)}</span>${mine?`<span style="display:block;margin-top:6px">${pill(ISTATUS,mine.status||'new',ic('check',13,2.4))}</span>`:''}</span><span class="chev" style="color:var(--muted)">${ic('chevR',20)}</span></button>`}).join('')}
function Changes(){const list=T().changes||[];
  return `${BackHead('Сделано по обращениям')}<div class="pad"><p class="small muted">Что изменилось на объектах после предложений сотрудников. Авторы обращений не указываются.</p>
  ${list.length?`<div class="stack-s" style="margin-top:14px">${list.map(c=>`<div class="card" style="border-left:4px solid var(--accent2)"><div class="row between"><span class="pill mut">${esc(c.cat)}</span><span class="xs muted">${fd(c.at)}</span></div><p class="b" style="margin-top:8px">${esc(c.text)}</p>${c.n?`<p class="xs muted" style="margin-top:4px">По ${c.n} ${plural(c.n,['обращению','обращениям','обращениям'])}</p>`:''}</div>`).join('')}</div>`:Empty('check','Пока пусто','Здесь появятся изменения по вашим предложениям')}
  <button class="btn warm" style="margin-top:18px" data-a="go" data-s="feedback">${ic('edit',20)}Предложить улучшение</button></div>`}

function Opp(id){const t=T(),o=t.opportunities.find(x=>x.id===id);if(!o)return BackHead('Возможность')+Empty('brief','Не найдено','Возможность снята с публикации');

  return `${BackHead('Возможность')}<div class="pad">
   <span class="pill">${esc(o.unit)}</span><h1 style="margin-top:10px">${esc(o.title)}</h1><p class="small muted" style="margin-top:4px">Опубликовано ${fd(o.at)}</p>

   ${(()=>{const has=(o.chk||[]).some(Boolean);const lab={ok:['Есть в паспорте','var(--success)','check'],part:['Заявлено, ждёт подтверждения','var(--warning)','clock'],no:['Нет в паспорте — обсудите с HR','var(--muted)','info']};
   return `<div class="card stack-s">${o.req.map((r,i)=>{const st=chkReq((o.chk||[])[i]);const l=st&&lab[st];return `<div class="row" style="align-items:flex-start"><span style="color:${l?l[1]:'var(--brand)'};margin-top:1px">${ic(l?l[2]:'check',18,2.2)}</span><span class="grow"><span class="small" style="display:block">${esc(r)}</span>${l?`<span class="xs" style="color:${l[1]}">${l[0]}</span>`:''}</span></div>`}).join('')}

  </div>`}
function Doc(id){const t=T(),c=t.credentials.find(x=>x.id===id);const st=credStatus(c);

  const d=daysTo(c.until);
  const row=(k,v)=>`<div class="row between" style="padding:11px 0;border-bottom:1px solid var(--border)"><span class="small muted">${k}</span><span class="small b" style="text-align:right">${v}</span></div>`;

     ${tr?`<button class="notice" style="margin-top:10px;width:100%;text-align:left" data-a="go" data-s="request" data-id="${tr.id}">${ic('inbox',18)}<span class="grow">Запрос на обучение — ${esc(RSTATUS[tr.status][0].toLowerCase())}</span>${ic('chevR',18)}</button>`:`<button class="btn warm" style="margin-top:12px" data-a="reqTraining" data-id="${c.id}">${ic('book',20)}Запросить обучение</button>`}

    const me=m.from==='me';return sep+`<div class="msg ${me?'me':''} ${m.demo?'auto':''}">${!me&&c.kind!=='news'?`<div class="who">${esc(m.name)}</div>`:''}${m.att?`<div class="att">${ic('clip',14)}${esc(m.att)}</div>`:''}${esc(m.text)}${m.link?`<div style="margin-top:8px"><button class="link" style="min-height:32px" data-a="openBenefit" data-id="${m.link}">Открыть программу ${ic('chevR',14)}</button></div>`:''}<div class="meta">${m.demo?'Автоответ · демо · ':''}${ft(m.at)}${me?(m.pending?ic('clock',12):ic('check',12,2.4)):''}</div></div>`}).join('')

 if(m.k==='csv'){const rows=parseCsv(m.text);c=`<div class="row between"><h2>Импорт сотрудников</h2>${demoTag}</div><p class="small muted" style="margin-top:6px">Формат: ФИО;Должность;Подразделение;Телефон. Рабочим без корпоративной почты приглашение приходит по SMS. В демо файл не загружается, отредактируйте пример.</p>
  <textarea class="textarea" style="margin-top:12px;font-family:ui-monospace,Menlo,monospace;font-size:13px;min-height:120px" id="csv-in" data-csv="1">${esc(m.text)}</textarea>
  <table class="tbl" style="margin-top:12px"><thead><tr><th>Строка</th><th>Проверка</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="small">${esc(r.name||'—')}<div class="xs muted">${esc(r.pos||'')}</div></td><td>${r.ok?'<span class="pill ok">Готово к импорту</span>':`<span class="pill err">${esc(r.err)}</span>`}</td></tr>`).join('')}</tbody></table>
  <div class="row" style="gap:8px;margin-top:16px"><button class="btn primary auto" data-a="csvImport" ${rows.some(r=>r.ok)?'':'disabled'}>Импортировать ${rows.filter(r=>r.ok).length}</button><button class="btn ghost auto" data-a="closeSheet">Отмена</button></div>`}

function parseCsv(text){const t=T();return text.split('\n').map(l=>l.trim()).filter(Boolean).slice(1).map(l=>{const [name,pos,unit,phone]=l.split(';').map(x=>(x||'').trim());
 if(!name||!pos)return {name,pos,ok:false,err:'Не хватает полей'};
 const norm=s=>s.toLowerCase().split(' ').sort().join(' ');
 if(t.employees.some(e=>norm(e.name)===norm(name)))return {name,pos,ok:false,err:'Дубликат'};
 if(!/\d{10}/.test((phone||'').replace(/\D/g,'')))return {name,pos,ok:false,err:'Нет телефона для SMS'};
 return {name,pos,unit,phone,ok:true}})}

/* ---- плеер ---- */
const mmss=s=>Math.floor(s/60)+':'+pad2(Math.floor(s%60));
function ensurePlayer(id){if(!S.ui.player||S.ui.player.id!==id)S.ui.player={id,running:false,elapsed:0,last:0,phase:-1};return S.ui.player}
function tick(){const pl=S.ui.player;const top=S.ui.stack[S.ui.stack.length-1];if(!pl||!top||top.s!=='player'){clearInterval(ticker);ticker=null;return}
 const now=performance.now();if(pl.running){pl.elapsed+=now-pl.last;pl.last=now}
 const p=PRACTICES.find(x=>x.id===pl.id);const sec=pl.elapsed/1000;
 if(p.type==='breath'){const cyc=p.pattern.reduce((a,x)=>a+x[1],0);const inC=sec%cyc;let acc=0,idx=0;for(let i=0;i<p.pattern.length;i++){if(inC<acc+p.pattern[i][1]){idx=i;break}acc+=p.pattern[i][1]}
  const ph=p.pattern[idx];const left=Math.ceil(acc+ph[1]-inC);const ball=document.getElementById('br-ball');
  const target=i=>{const n=p.pattern[i][0];if(n==='Вдох')return 1;if(n==='Выдох')return .55;return target((i-1+p.pattern.length)%p.pattern.length)};
  if(ball){if(!pl.running){if(pl.phase!==-2){const cs=getComputedStyle(ball).transform;ball.style.transition='none';ball.style.transform=cs==='none'?'scale(.55)':cs;pl.phase=-2}}
   else if(pl.phase!==idx){ball.style.transition=`transform ${(acc+ph[1]-inC).toFixed(2)}s ease-in-out`;ball.style.transform=`scale(${target(idx)})`;pl.phase=idx}}
  const lb=document.getElementById('br-label');if(lb)lb.textContent=pl.elapsed>0?ph[0]:'Начнём?';
  const sc=document.getElementById('br-sec');if(sc)sc.textContent=pl.elapsed>0?left+' с':'нажмите старт';
